---
layout: default
---

<div class="post-header">
  <p class="eyebrow">{{ page.date | date: "%B %-d, %Y" }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
</div>

<div class="post-body">
  {{ content }}
</div>

<div class="post-nav">
  <a href="/posts/">← All posts</a>
</div>
