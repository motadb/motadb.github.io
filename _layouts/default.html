<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <header>
      <div class="page-wrapper">
        <h1 style="margin:0 0 8px;color:var(--accent)">David Mota</h1>
        <p style="margin:0"><a href="https://github.com/motadb">View My GitHub Profile</a></p>
      </div>
    </header>

    <main class="page-wrapper">
      {{ content }}
    </main>

    <footer class="page-wrapper" style="margin-top:48px;color:#777;font-size:0.95rem">
      <p>Hosted on GitHub Pages</p>
    </footer>
  </body>
</html>
