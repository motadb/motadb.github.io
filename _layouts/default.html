<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} — motadb{% else %}motadb{% endif %}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23181817'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Georgia%2C serif' font-size='14' font-weight='600' fill='%23f9f8f6' letter-spacing='-0.5'%3Emb%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="{% if page.lang == 'pt' %}/pt/{% else %}/{% endif %}" class="wordmark">motadb</a>
      <div class="nav-links">
        <a href="{% if page.lang == 'pt' %}/pt/posts/{% else %}/posts/{% endif %}">{% if page.lang == 'pt' %}Escrita{% else %}Writing{% endif %}</a>
        <a href="{% if page.lang == 'pt' %}/pt/about/{% else %}/about/{% endif %}">About</a>
        {% if page.lang == 'pt' %}
          <a href="{{ page.url | remove_first: '/pt' }}" class="lang-switch">EN</a>
        {% else %}
          <a href="/pt{{ page.url }}" class="lang-switch">PT</a>
        {% endif %}
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon"></span>
        </button>
      </div>
    </nav>
    <hr class="rule">

    {{ content }}

    <footer>
      <span>motadb</span>
    </footer>
  </div>
<script>
  (function() {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch(e) {}
    if (saved) document.documentElement.setAttribute('data-theme', saved);

    function getTheme() {
      return document.documentElement.getAttribute('data-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }

    function updateIcon() {
      var icon = document.querySelector('.theme-icon');
      if (!icon) return;
      icon.textContent = getTheme() === 'dark' ? '☀' : '☾';
    }

    document.addEventListener('DOMContentLoaded', function() {
      updateIcon();
      document.getElementById('themeToggle').addEventListener('click', function() {
        var next = getTheme() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch(e) {}
        updateIcon();
      });
    });
  })();
</script>
</body>
</html>
